# Config used to record the hosted demo (demo/record-demo.sh).
#
# Everything is simulated: `provider = "mock"` drives crates/device-mock rather
# than any real BirdDog PLAY, and gives the network scan and NDI source list
# canned answers (crates/discovery/src/mock.rs) instead of looking at the real
# LAN. The registry is seeded with canned devices and written somewhere
# throwaway so recording can't touch a real device list.
bind = "127.0.0.1:8099"
registry_path = "data/registry-demo.json"
app_settings_path = "data/app_settings-demo.json"
seed_demo_devices = true
provider = "mock"
